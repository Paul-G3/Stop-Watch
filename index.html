<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/3c4e3843ca.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="index.css">
    <title>Stop Watch</title>
</head>
<body>

    <div class="container">
        <div class="timer">
            0:0:0
        </div>

        <div class="buttons">
            <button class="play" title="Play">
                <i class="fa-solid fa-play"></i>
            </button>

            <button class="reset" title="Reset">
                <i class="fa-solid fa-arrow-rotate-left"></i>
            </button>
        </div>
    </div>
    
    
    <script src="index.js"></script>
</body>
</html>
